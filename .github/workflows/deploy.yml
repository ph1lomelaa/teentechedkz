name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Backend imports shared migration helpers from the repository root.
      # Several validation steps run with working-directory=backend, so make
      # the root importable consistently for pytest, bootstrap and live E2E.
      PYTHONPATH: ${{ github.workspace }}

    # Postgres для проверки миграций (alembic upgrade head на чистой БД).
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tte
          POSTGRES_PASSWORD: tte
          POSTGRES_DB: tte_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tte"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ---------- Frontend ----------
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # Неблокирующий: 8 legacy react-hooks/exhaustive-deps предупреждений
      # (см. TODO_PROD.md, блок 3). Ошибки eslint при этом уже блокируют — их нет.
      # continue-on-error снят 30.08.2026: до этого линт падал всегда (один
      # давний warning при --max-warnings 0), поэтому красный результат был
      # нормой и настоящий дефект в нём утонул бы.
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend (vitest)
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://teenteched.kz
        run: npm run build

      # ---------- Backend ----------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install system deps (libmagic for python-magic)
        run: sudo apt-get update && sudo apt-get install -y libmagic1 postgresql-client

      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt

      - name: Backend unit tests (pytest)
        working-directory: backend
        run: python -m pytest -q

      - name: Schema + migrations bootstrap cleanly (prod startup path)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://tte:tte@localhost:5432/tte_db
        run: |
          # Повторяем ровно то, что делает бэкенд при старте в проде
          # (см. docker-compose.prod.yml command:). Схема на проде строится через
          # bootstrap_db (create_all + stamp head), а не прогоном миграций с нуля —
          # поэтому `alembic upgrade head` с пустой БД тут НЕ подходит (упадёт).
          # Эта проверка ловит: поломанные модели, ошибки импорта, битый alembic-конфиг.
          PGPASSWORD=tte psql -h localhost -U tte -d tte_db \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          python -m app.core.bootstrap_db
          alembic upgrade head
          # Единственный head: ловит забытый merge при расхождении веток миграций.
          heads=$(alembic heads | grep -c '(head)')
          test "$heads" -eq 1 || { echo "Ожидался ровно 1 alembic head, найдено: $heads"; alembic heads; exit 1; }

      - name: Live E2E (auth + role access matrix + telegram)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://tte:tte@localhost:5432/tte_db
          REDIS_URL: redis://localhost:6379/0
          FRONTEND_URL: http://localhost:3000
          ENVIRONMENT: development
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8001 >/tmp/tte-e2e-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/tte-e2e-api.log
              exit 1
            fi
            sleep 1
          done
          python tests/e2e_auth_intake.py
          # Матрица доступа по четырём ролям. Лежала готовой, но не гонялась:
          # pytest.ini собирает только test_*.py, а в workflow шага не было.
          # Приложение уже поднято выше — переиспользуем тот же uvicorn.
          python tests/e2e_workspace_roles.py http://127.0.0.1:8001
          # Telegram: привязка группы, участники, переназначение, сессии.
          # Тоже лежал ненужным — был вписан порт 8000, которого здесь нет.
          # Внешних сервисов не требует: работает с БД и API, к Telegram не
          # ходит (`consume_pairing_code` — та же продовая функция, локально).
          #
          # `e2e_workspace_meeting.py` сюда НЕ добавлен намеренно: ему нужен
          # MinIO (загрузка аудио) и настоящий ключ Deepgram — фолбэка нет,
          # `deepgram_rest` падает без ключа. Это отдельный сервис в CI и
          # платные запросы на каждый прогон, то есть решение, а не мелочь.
          python tests/e2e_workspace_telegram.py http://127.0.0.1:8001
          # Самозапись: тупик «email занят, кабинет выдать нечем» и очередь
          # заявок. Тремя звеньями (занятый email, students.user_id, роль) он
          # собирался только вживую — юнит-тестами каждое звено выглядело
          # исправным. Сам /public/join сюда не входит: нужен настоящий
          # id_token от Google, а вердикт матчинга покрыт test_access_requests.
          python tests/e2e_access_requests.py http://127.0.0.1:8001

      # ---------- Compose ----------
      - name: Validate docker compose
        run: |
          touch .env
          docker compose -f docker-compose.prod.yml config

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull origin main
            # Бэкап БД ПЕРЕД накатом миграций: миграции идут в command: бэкенда при
            # старте, откатить их без дампа нельзя. Не валим деплой, если бэкап
            # не удался на самом первом запуске (контейнеров ещё нет) — но на
            # рабочем проде дамп обязан сняться.
            if docker inspect tte_postgres_prod >/dev/null 2>&1; then
              bash scripts/backup.sh
            else
              echo "Первый запуск: рабочей БД ещё нет, pre-deploy backup пропущен."
            fi
            if ! docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 180; then
              echo "=== Production compose status ==="
              docker compose -f docker-compose.prod.yml ps -a
              echo "=== Backend logs ==="
              docker compose -f docker-compose.prod.yml logs --no-color --tail=250 backend || true
              echo "=== Worker logs ==="
              docker compose -f docker-compose.prod.yml logs --no-color --tail=150 worker || true
              echo "=== Backend health state ==="
              docker inspect --format='{{json .State.Health}}' tte_backend_prod || true
              exit 1
            fi
            # `up -d` означает лишь «процесс запущен». Проверяем и внутренние
            # loopback-порты, и реальный публичный маршрут через Caddy.
            curl --fail --silent --show-error http://127.0.0.1:8000/health
            curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null
            curl --fail --silent --show-error \
              --retry 12 --retry-delay 5 --retry-all-errors \
              https://teenteched.kz/health
