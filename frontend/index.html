<!doctype html>
<html lang="ru" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Переводчики браузера переписывают текстовые узлы за спиной React и
         могут вызвать NotFoundError при следующем рендере. Кабинет уже на
         русском, поэтому автоматический перевод здесь не нужен. -->
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>TeenTechEd</title>
    <script>
      (function () {
        try {
          // Тёмная тема — дефолт. Светлая только если пользователь явно
          // выбрал её переключателем. Ключ версии v2 — старый 'teenteched-theme'
          // мог хранить 'light', унаследованный от прежнего бага миграции.
          var theme = localStorage.getItem('teenteched-theme-v2') === 'light' ? 'light' : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.dataset.crmTheme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="notranslate" translate="no">
    <div id="root" class="notranslate" translate="no"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
