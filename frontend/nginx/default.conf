server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Заголовки безопасности ---
    # `always` — чтобы заголовки уходили и на ответах-ошибках (4xx/5xx).
    # Эти три безопасны и не ломают SPA:
    add_header X-Frame-Options "DENY" always;                       # защита от clickjacking
    add_header X-Content-Type-Options "nosniff" always;             # запрет MIME-sniffing
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Отключаем неиспользуемые браузерные фичи.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content-Security-Policy — самый мощный, но и самый ломучий заголовок.
    # Заготовка ниже рассчитана на этот SPA (API/WebSocket того же origin через Caddy,
    # инлайновые стили React требуют 'unsafe-inline' в style-src). ПЕРЕД включением
    # прогони приложение и проверь консоль браузера на CSP-ошибки (внешние картинки,
    # флаги стран, шрифты могут потребовать доп. источников). Затем раскомментируй:
    #
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Собранные файлы (assets/*.js, *.css) — НИКОГДА не отдавать index.html.
    #
    # Ради чего: имена чанков содержат хеш и меняются с каждым деплоем. Вкладка,
    # открытая до выката, просит старый чанк — его уже нет, и общий `try_files`
    # ниже отдавал в ответ index.html с типом text/html. Браузер получал HTML
    # там, где ждал модуль, и падал с «'text/html' is not a valid JavaScript
    # MIME type» — экран «Экран не открылся» ровно отсюда.
    #
    # Теперь такой запрос честно получает 404, а приложение по нему понимает,
    # что версия устарела, и перезагружается само (см. AppErrorBoundary).
    location /assets/ {
        try_files $uri =404;
        # Имя файла содержит хеш содержимого: тот же URL — всегда тот же байт.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html кэшировать нельзя: именно в нём лежат ссылки на текущие чанки.
    # Закэшированный index.html — это вкладка, которая после деплоя вечно просит
    # несуществующие файлы.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
