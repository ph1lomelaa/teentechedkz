# Стек мониторинга TeenTechEd.
#
# Prometheus + Grafana + node_exporter + cAdvisor (метрики хоста/контейнеров),
# Loki + Promtail (логи с поиском), postgres_exporter + redis_exporter (БД/Redis).
#
# Запуск (на сервере, из корня репо):
#   docker compose -f monitoring/docker-compose.monitoring.yml up -d
#
# СЕТЬ: часть сервисов подключается к сети приложения (external), чтобы дотянуться
# до backend/postgres/redis. Имя сети задаётся APP_NETWORK (по умолчанию
# teenteched_default — прод, COMPOSE_PROJECT_NAME=teenteched). В деве это обычно
# teentechedkz_default — тогда: APP_NETWORK=teentechedkz_default docker compose ... up -d
#
# БЕЗОПАСНОСТЬ: всё слушает только 127.0.0.1. Смотришь через SSH-туннель:
#   ssh -L 3001:localhost:3001 user@65.21.188.181  →  http://localhost:3001

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  monitoring:
    driver: bridge
  app:
    external: true
    name: ${APP_NETWORK:-teenteched_default}

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tte_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [monitoring, app]   # app — чтобы скрейпить backend/:8000/metrics
    logging: *default-logging
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: tte_node_exporter
    command:
      - "--path.rootfs=/host"
      # Читает *.prom файлы (метрики бэкапа и т.п.), которые кладут внешние скрипты.
      - "--collector.textfile.directory=/textfile"
    pid: host
    volumes:
      - /:/host:ro,rslave
      - ./textfile:/textfile:ro
    ports:
      - "127.0.0.1:9100:9100"
    networks: [monitoring]
    logging: *default-logging
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: tte_cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    ports:
      - "127.0.0.1:8080:8080"
    networks: [monitoring]
    logging: *default-logging
    restart: unless-stopped

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: tte_postgres_exporter
    environment:
      # Собирает статистику БД: соединения, размер, попадания в кэш, медленные запросы.
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-tte}:${POSTGRES_PASSWORD:-tte}@${PG_HOST:-tte_postgres_prod}:5432/${POSTGRES_DB:-tte_db}?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"
    networks: [monitoring, app]
    logging: *default-logging
    restart: unless-stopped

  redis_exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: tte_redis_exporter
    environment:
      # Память, хиты/промахи, число ключей, длина очереди arq.
      REDIS_ADDR: "redis://${REDIS_HOST:-tte_redis_prod}:6379"
    ports:
      - "127.0.0.1:9121:9121"
    networks: [monitoring, app]
    logging: *default-logging
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    container_name: tte_loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks: [monitoring]
    logging: *default-logging
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    container_name: tte_promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Читает логи контейнеров и метаданные Docker.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    networks: [monitoring]
    depends_on:
      - loki
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    container_name: tte_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-changeme-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Для доступа через Caddy по подпути задай на сервере:
      #   GF_ROOT_URL=https://teenteched.duckdns.org/grafana  GF_SERVE_SUBPATH=true
      GF_SERVER_ROOT_URL: ${GF_ROOT_URL:-http://localhost:3001}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GF_SERVE_SUBPATH:-false}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    # app — чтобы контейнер прод-Caddy мог достучаться до tte_grafana:3000.
    networks: [monitoring, app]
    depends_on:
      - prometheus
    logging: *default-logging
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
