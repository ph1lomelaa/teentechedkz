# Что и как часто собирать. Prometheus сам ходит по этим целям и складывает метрики.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Сам Prometheus (его внутренние метрики).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Метрики хоста: CPU, RAM, диск, сеть, load average.
  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]

  # Метрики контейнеров: CPU/RAM/сеть/рестарты по каждому контейнеру.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Метрики приложения: RPS, латентность, коды ответов по эндпоинтам (/metrics).
  # Доступно только по внутренней сети — наружу Caddy /metrics не проксирует.
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      # Имя прод-контейнера бэкенда. В деве это tte_backend — поправь при необходимости.
      - targets: ["tte_backend_prod:8000"]

  # Метрики PostgreSQL: соединения, размер БД, кэш-хиты, долгие транзакции.
  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  # Метрики Redis: память, хиты/промахи, число ключей, длина очереди arq.
  - job_name: redis
    static_configs:
      - targets: ["redis_exporter:9121"]
