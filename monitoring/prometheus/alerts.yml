# Правила алертов. Prometheus вычисляет их постоянно; сработавшие видны в
# Grafana (Alerting) и на самом Prometheus (http://localhost:9090/alerts).
# Чтобы алерты УХОДИЛИ в Telegram/почту — настрой contact point в Grafana
# (см. monitoring/README.md, раздел «Алерты»).
groups:
  - name: host
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Сервер/экспортер не отвечает 2+ минуты"

      - alert: HighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "CPU > 90% уже 10 минут"

      - alert: HighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "RAM > 90% уже 10 минут"

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/host"} / node_filesystem_size_bytes{mountpoint="/host"}) * 100 < 15
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "На диске меньше 15% свободного места"

  - name: containers
    rules:
      # Контейнер часто перезапускается (падает и поднимается) — почти всегда баг/OOM.
      - alert: ContainerRestarting
        expr: rate(container_last_seen{name=~"tte_.+"}[5m]) == 0
        for: 3m
        labels: { severity: warning }
        annotations:
          summary: "Контейнер {{ $labels.name }} не виден 3+ минуты (упал/перезапускается)"

      # Контейнер приложения близко к своему лимиту памяти (мы ставили 1536M).
      - alert: ContainerMemoryHigh
        expr: (container_memory_usage_bytes{name=~"tte_(backend|worker)_prod"} / 1073741824) > 1.4
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.name }} ест >1.4G из лимита 1.5G — близко к OOM"

  - name: backup
    rules:
      # Бэкап БД не обновлялся дольше 26 часов (при суточном cron — значит не отработал).
      - alert: BackupStale
        expr: time() - tte_backup_last_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Бэкап БД не обновлялся >26ч — проверь cron scripts/backup.sh"

      # Метрика бэкапа вообще отсутствует (скрипт ни разу не отработал / node_exporter не видит файл).
      - alert: BackupMetricMissing
        expr: absent(tte_backup_last_success_timestamp_seconds)
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Нет метрики бэкапа — backup.sh не запускался или textfile не подключён"

  - name: app
    rules:
      # Заметная доля 5xx на API за 5 минут.
      - alert: HighHttpErrorRate
        expr: |
          sum(rate(http_requests_total{job="backend",status="5xx"}[5m]))
          / sum(rate(http_requests_total{job="backend"}[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Более 5% ответов API — 5xx за последние 5 минут"

      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Backend не отдаёт /metrics 2+ минуты"

  - name: datastores
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "postgres_exporter не может подключиться к БД"

      # Приближение к лимиту соединений Postgres (по умолчанию 100).
      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) > 80
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Postgres: >80 активных соединений (лимит ~100)"

      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "redis_exporter не может подключиться к Redis"
