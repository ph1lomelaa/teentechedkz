# Promtail собирает логи всех Docker-контейнеров и шлёт в Loki.
# Контейнеры обнаруживаются через Docker API; в лейблы попадают имя контейнера
# и compose-сервис — по ним удобно фильтровать в Grafana.
server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Имя контейнера (убираем ведущий "/").
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      # Имя сервиса из docker-compose, если есть.
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service
      # Поток stdout/stderr.
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
