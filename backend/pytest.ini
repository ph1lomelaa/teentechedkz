[pytest]
# Тесты используют unittest.IsolatedAsyncioTestCase — pytest-asyncio не нужен.
# pythonpath делает импортируемыми и app (backend/), и migration (корень репо, на уровень выше).
pythonpath = . ..
testpaths = tests
# Только настоящие юнит-тесты (test_*.py). e2e_*.py требуют живой БД/сервисов и в CI не гоняются.
python_files = test_*.py
