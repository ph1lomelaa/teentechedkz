# Ротация логов: без неё json-file драйвер Docker растёт безгранично и со
# временем забивает диск сервера. Общий якорь для всех сервисов.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:15-alpine
    container_name: tte_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tte}
      POSTGRES_DB: ${POSTGRES_DB:-tte_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_pgcrypto.sql:/docker-entrypoint-initdb.d/init_pgcrypto.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tte} -d ${POSTGRES_DB:-tte_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: tte_minio_prod
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tte_redis_prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tte_backend_prod
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tte}:${POSTGRES_PASSWORD:-tte}@postgres:5432/${POSTGRES_DB:-tte_db}
      REDIS_URL: redis://redis:6379/0
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
    volumes:
      - ./google_service_account.json:/data/google_service_account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped
    # Лимиты ресурсов: одна утечка/тяжёлый запрос не должен съесть всю память
    # сервера. Подбери числа под реальный VPS (см. `free -h`, `nproc`).
    deploy:
      resources:
        limits:
          memory: 1536M
    command: >
      sh -c "until nc -z postgres 5432; do echo 'Waiting for postgres...'; sleep 2; done &&
             python -m app.core.bootstrap_db &&
             alembic upgrade head &&
             python -m app.core.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-2}"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tte_worker_prod
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tte}:${POSTGRES_PASSWORD:-tte}@postgres:5432/${POSTGRES_DB:-tte_db}
      REDIS_URL: redis://redis:6379/0
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-2}
    volumes:
      - ./google_service_account.json:/data/google_service_account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
    command: >
      sh -c "until nc -z postgres 5432; do echo 'Waiting for postgres...'; sleep 2; done &&
             arq app.worker.WorkerSettings"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-https://teenteched.duckdns.org}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: tte_frontend_prod
    depends_on:
      backend:
        condition: service_started
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
